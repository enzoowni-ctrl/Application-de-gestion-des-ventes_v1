security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_AGENT: ROLE_USER
        ROLE_SUPERVISEUR: ROLE_USER
        ROLE_CHEF_PLATEAU: [ROLE_SUPERVISEUR, ROLE_USER]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets)/
            security: false
        api:
            pattern: ^/api
            lazy: true
            provider: app_user_provider
            entry_point: App\Security\JsonAuthenticationEntryPoint
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
            logout:
                path: api_logout
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/users, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/baremes, methods: [POST, PUT, PATCH, DELETE], roles: ROLE_SUPERVISEUR }
        - { path: ^/api/work-hours, methods: [POST, PUT], roles: ROLE_SUPERVISEUR }
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10